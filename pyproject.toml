[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chirchiq-anonymous-bot"
version = "0.1.0"
description = "Anonymous submissions and comments bot for Chirchiq State Pedagogical University"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.31.0",
  "alembic==1.19.1",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pypdf==6.16.2",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.22.1",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
