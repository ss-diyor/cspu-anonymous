name: CI and security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install -e ".[dev]" pip-audit
      - run: python -m ruff check app tests migrations
      - run: python -m pytest -q
      - run: python -m pip_audit

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cspu-anonymous:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: cspu-anonymous:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
